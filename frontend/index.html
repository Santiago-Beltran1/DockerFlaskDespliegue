<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Aprendices</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { text-align: center; color: #2c3e50; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #27ae60; }
        ul { list-style: none; padding: 0; }
        li { background: #ecf0f1; padding: 12px; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; }
        .ficha { font-size: 0.85em; color: #7f8c8d; background: #fff; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulario de Aprendices</h1>
        
        <h2>Registrar Aprendice</h2>
        <form id="registroForm">
            <input type="text" id="nombre" placeholder="Nombre Completo" required>
            <input type="text" id="documento" placeholder="Número de Documento" required>
            <input type="text" id="ficha" placeholder="Ficha de Caracterización" required>
            <button type="submit">Guardar Registro</button>
        </form>

        <h2>Listado Actual</h2>
        <ul id="listaAprendices">
            <!-- Los datos se cargarán aquí dinámicamente -->
        </ul>
    </div>

    <script>
        // Apuntamos al puerto 5050 que configuramos en el backend dentro de Docker
        const API_URL = 'http://localhost:5050';

        // Función para obtener y listar los aprendices desde Flask
        async function cargarAprendices() {
            try {
                const res = await fetch(`${API_URL}/`);
                // Como tu backend de Flask actualmente renderiza una plantilla en vez de JSON puro,
                // si da problemas de compatibilidad en el fetch, puedes cambiar la ruta "/" de tu Flask 
                // para que retorne un JSON, o simplemente usar este front interactivo.
                if(res.ok) {
                    console.log("Conectado con el Backend con éxito");
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
            }
        }

        // Manejar el envío del formulario hacia Flask
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('documento', document.getElementById('documento').value);
            formData.append('ficha', document.getElementById('ficha').value);

            try {
                await fetch(`${API_URL}/registrar`, {
                    method: 'POST',
                    body: formData
                });
                alert('¡Aprendiz registrado con éxito!');
                document.getElementById('registroForm').reset();
                cargarAprendices();
            } catch (error) {
                alert('Error al enviar los datos al backend.');
            }
        });

        // Cargar los datos al iniciar la página
        cargarAprendices();
    </script>
</body>
</html>
