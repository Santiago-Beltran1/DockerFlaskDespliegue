name: Pipeline Tests y Despliegue

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]

jobs:
  # Tests
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (badnit) 
        run: bandit -r . -s B101 # para ignorar

      - name: Ejecutar pruebas unitarias con Pytest
        run: |
          python -m pytest

  # Despliegue 
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-security
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      
      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: santiagob084/mi-api:latest

      - name: Construir y subir imagen nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: santiagob084/mi-nginx:latest

      - name: Construir y subir imagen frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: santiagob084/mi-frontend:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: 'santiagob084/mi-api:latest'
          format: 'table'
          exit-code: '1' # Si encuentra alguna falla
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Los tipos de gravedad de error que se mostraran 

      - name: Subir la imágen a DockerHub
        run: docker push santiagob084/mi-api:latest      

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/mi-despliegue
            docker compose pull
            docker compose up -d