name: Publicar Imagen en Docker Hub y Desplegar en Servidor

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3
      
      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen backend
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: santiagob084/mi-api:latest

      - name: Construir y subir imagen nginx
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          push: true
          tags: santiagob084/mi-nginx:latest

      - name: Construir y subir imagen frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: santiagob084/mi-frontend:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerFlaskDeplegado
            docker compose pull
            docker compose up -d